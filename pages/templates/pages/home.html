<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UH Mānoa Course Career Pathway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(6px);
    }

    .chip {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(26, 115, 232, 0.12);
    }

    pre {
      white-space: pre-wrap;
    }
  </style>
</head>

<body class="bg-[#BDCCBD] text-gray-900">
  <div class="min-h-screen p-6 max-w-6xl mx-auto">
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-4">
        <div
          class="w-12 h-12 rounded-full flex items-center justify-center bg-green-900 text-white font-bold">
          UH</div>
        <div>
          <h1 class="text-2xl font-semibold">UH Mānoa Course Career Pathway</h1>
          <p class="text-2xl text-gray-900">Kūlia i ka Nuʻu</p>
        </div>
      </div>
    </header>

    <main class="grid grid-cols-12 gap-6">
      <section class="col-span-12">
        <div class="p-4 bg-white rounded-lg shadow flex flex-col h-[70vh]">
          <div id="chatWindow" class="flex-1 overflow-auto p-2 space-y-3" aria-live="polite">
            <div class="text-xl text-gray-700">Type your dream career to get course recommendations.</div>
          </div>

          <div class="mt-3">
            <div class="flex gap-2">
              <input id="followupInput" class="flex-1 p-2 rounded-md border" placeholder="Ask something else, e.g. 'What skills do I need for this career?'" />
              <button id="sendBtn" class="px-4 py-2 rounded-md bg-green-900 text-white">Submit</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="mt-6 text-center text-xl text-gray-900">ONLY University of Hawaiʻi at Mānoa Courses Displayed. Check
      Official Catalog for Semester Availability. University of Hilo and Community Colleges Check Separately.</footer>
  </div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    fetch("/pages/gemini/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: "__start__" })
    })
    .then(r => r.json())
    .then(data => {
      if (data.response) appendMessage("assistant", data.response);
    });
  });

  const courseList = document.getElementById('courseList');
  const chatWindow = document.getElementById('chatWindow');
  const sendBtn = document.getElementById('sendBtn');
  const followupInput = document.getElementById('followupInput');

  function appendMessage(who, text) {
    const msg = document.createElement('div');
    msg.className = who === 'user' ? 'text-right' : 'text-left';
    msg.innerHTML = `<div class="inline-block ${who === 'user' ? 'bg-green-50' : 'bg-gray-200'} p-3 rounded-md max-w-[75%]"><div class="text-xl">${escapeHtml(text)}</div></div>`;
    chatWindow.appendChild(msg);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  async function handleQuery(text) {
    if (!text.trim()) return;
    appendMessage('user', text);

    try {
      const response = await fetch('/pages/gemini/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: text })
      });
      const data = await response.json();
      appendMessage('assistant', data.response || "Error: " + data.error);
    } catch (err) {
      appendMessage('assistant', "Error contacting AI: " + err.message);
    }
  }

  sendBtn.addEventListener('click', () => {
    handleQuery(followupInput.value);
    followupInput.value = '';
  });

  followupInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleQuery(followupInput.value);
      followupInput.value = '';
    }
  });

  function escapeHtml(unsafe) {
    return unsafe.replaceAll('&', '&amp;')
                 .replaceAll('<', '&lt;')
                 .replaceAll('>', '&gt;')
                 .replaceAll('\n', '<br>');
  }
</script>
